/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 4
        filter_size_surf: 0.15
        filter_size_map: 0.2
        cube_side_length: 500.0
        runtime_pos_log_enable: false

        common:
            lid_topic:  "/px4_offboard_sim/lidar/points"
            imu_topic:  "/px4_offboard_sim/imu/data"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 5       # GAZEBOSIM handler
            scan_line:  120
            blind:      0.3
            scan_rate:  10
            timestamp_unit: 0   # seconds (simulation time)

        mapping:
            acc_cov: 0.001
            gyr_cov: 0.0001
            b_acc_cov: 0.00001
            b_gyr_cov: 0.000001
            fov_degree: 360.0
            det_range:  40.0
            extrinsic_est_en: false
            extrinsic_T: [0.0, 0.0, 0.052]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true
            map_frame_id: "camera_init"
            body_frame_id: "body"

        pcd_save:
            pcd_save_en: false
            interval: -1
